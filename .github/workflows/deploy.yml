name: 🖥️ Deploy Frontend (Expo Web)

on:
  push:
    branches: ['main']
    paths:
      - 'app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/integral-scan-web:latest

      - name: Deploy sur le serveur via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.SERVER_USER }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/integral-scan-web:latest
            docker stop integral-scan-frontend || true
            docker rm integral-scan-frontend || true
            docker run -d \
              --name integral-scan-frontend \
              -p 8888:80 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/integral-scan-web:latest
