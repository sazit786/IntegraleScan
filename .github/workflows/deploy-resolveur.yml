name: 🧮 Deploy Résolveur Python (API)

on:
  push:
    branches: ['main']
    paths:
      - 'config files/resolveur/**'
      - 'resolveur_integrales.py'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparer le contexte de build
        run: |
          mkdir -p build_resolveur
          cp resolveur_integrales.py build_resolveur/
          cp "config files/resolveur/api.py" build_resolveur/
          cp "config files/resolveur/Dockerfile" build_resolveur/

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push
        uses: docker/build-push-action@v5
        with:
          context: ./build_resolveur
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/integral-scan-resolveur:latest

      - name: ✅ Image publiée — Watchtower déploie automatiquement
        run: echo "Image pushed to ghcr.io. Watchtower will pull and redeploy automatically."
