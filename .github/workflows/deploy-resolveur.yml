name: Build et Publish Résolveur Docker Image

on:
  push:
    branches: ['main']
    paths:
      - 'config files/resolveur/**'
      - 'resolveur_integrales.py'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparer le contexte de build
        run: |
          mkdir -p build_resolveur
          cp resolveur_integrales.py build_resolveur/
          cp "config files/resolveur/api.py" build_resolveur/
          cp "config files/resolveur/Dockerfile" build_resolveur/

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push
        uses: docker/build-push-action@v5
        with:
          context: ./build_resolveur
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/integral-scan-resolveur:latest

      - name: Deploy sur le serveur via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.SERVER_USER }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/integral-scan-resolveur:latest
            docker stop resolveur-integrales || true
            docker rm resolveur-integrales || true
            docker run -d \
              --name resolveur-integrales \
              -p 8100:8100 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/integral-scan-resolveur:latest
